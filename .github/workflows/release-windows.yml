name: Release Windows

# 与 macOS 正式版一致：推送 v* tag 触发；也可在 Actions 页面手动指定 tag 重打。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag，例如 v0.3.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (x64 · NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # 应用内更新签名；未配置时构建照常，只是不产出更新包
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Fetch bundled Python runtime
        shell: bash
        run: bash tools/fetch_python_runtime.sh

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # ffmpeg.exe 因超过 GitHub 单文件 100MB 限制未入库（见 .gitignore），
      # 打包前在 CI 现取 BtbN 官方 win64 构建，仅抽取 ffmpeg.exe 放进伴生目录。
      - name: Download bundled ffmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "src-tauri/bin/windows-x64"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-win64.zip"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $extract = Join-Path $env:RUNNER_TEMP "ffmpeg-win64"
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract
          $ff = Get-ChildItem -Path $extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if (-not $ff) { throw "解压后未找到 ffmpeg.exe" }
          Copy-Item $ff.FullName -Destination (Join-Path $dest "ffmpeg.exe") -Force
          Write-Output "ffmpeg.exe -> $dest ($((Get-Item (Join-Path $dest 'ffmpeg.exe')).Length) bytes)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -C web run build

      # 生成 CI 专用配置：版本号取 tag，并跳过本地 beforeBuildCommand。
      # 配置了签名私钥才开启 createUpdaterArtifacts，否则构建会因缺少私钥失败。
      - name: Prepare CI config
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            printf '{"version":"%s","build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":true}}' \
              "${{ steps.version.outputs.value }}" > "$RUNNER_TEMP/tauri.ci.conf.json"
          else
            printf '{"version":"%s","build":{"beforeBuildCommand":""}}' \
              "${{ steps.version.outputs.value }}" > "$RUNNER_TEMP/tauri.ci.conf.json"
            echo "::warning title=updater::未配置 TAURI_SIGNING_PRIVATE_KEY，本次不产出应用内更新包"
          fi
          cat "$RUNNER_TEMP/tauri.ci.conf.json"

      # 失败时把日志尾部写进 Job Summary，并把第一条错误作为注解暴露出来。
      - name: Build NSIS
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          tauri build \
            --target x86_64-pc-windows-msvc \
            --bundles nsis \
            --config "$RUNNER_TEMP/tauri.ci.conf.json" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## ❌ Build failed (exit $status)"
              echo '```'
              tail -n 120 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -i -m1 -E "error(\[|:)|failed|panic" build.log \
              | while IFS= read -r line; do echo "::error title=build.log::${line}"; done
            exit "$status"
          fi

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          $exe = Get-ChildItem -Path $dir -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "未找到 NSIS 安装包" }
          Push-Location $dir
          $lines = Get-ChildItem -Filter "*.exe" | ForEach-Object {
              $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$h  $($_.Name)"
          }
          $lines | Set-Content -Path "SHA256SUMS-windows.txt" -Encoding ascii
          Pop-Location
          Get-Content (Join-Path $dir "SHA256SUMS-windows.txt")

      # 与 macOS 正式 Release 合并到同一 tag：仅追加资产，不覆盖对方写好的正文。
      # allow_updates 让两个平台并行发布时能安全地各自上传自己的产物。
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Voxril ${{ env.TAG }}
          draft: false
          prerelease: false
          allow_updates: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS-windows.txt

      # 应用内更新：签名文件 + 平台清单（清单名与 endpoint 的 {{target}} 对应）。
      # 与 macOS 一样不写进 Publish release asset 的 files，
      # 以免未配置签名密钥时 fail_on_unmatched_files 直接把发布步骤打挂。
      - name: Publish updater artifacts
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIR="src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          SIG=$(ls "$DIR"/*.exe.sig | head -1)
          PKG=$(basename "${SIG%.sig}")
          MANIFEST="$RUNNER_TEMP/latest-windows-x86_64.json"
          jq -n \
            --arg version "${TAG#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$(cat "$SIG")" \
            --arg url "https://github.com/Harrison-Yuan/Voxril/releases/download/${TAG}/${PKG}" \
            '{version: $version, pub_date: $date,
              platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' \
            > "$MANIFEST"
          cat "$MANIFEST"
          gh release upload "$TAG" "$SIG" "$MANIFEST" --clobber
