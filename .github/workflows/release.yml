name: Release

on:
  push:
    tags:
      - "v*"
  # 需要重打某个 tag 时，在 Actions 页面手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag，例如 v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      # ── 可选：配置这些 secrets 后会自动签名 + 公证，用户双击即可打开 ──
      # APPLE_CERTIFICATE            Developer ID Application 证书（.p12 的 base64）
      # APPLE_CERTIFICATE_PASSWORD   证书密码
      # KEYCHAIN_PASSWORD            临时钥匙串密码（随便生成一个）
      # APPLE_SIGNING_IDENTITY       例如 "Developer ID Application: Your Name (TEAMID)"
      # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID   公证用（APPLE_PASSWORD 为 App 专用密码）
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 生成一份 CI 专用配置：版本号取 tag，且跳过本地的 beforeBuildCommand
      # （CI 里没有 .venv，bump_version 与依赖校验只适用于本地打包）
      - name: Prepare CI config
        run: |
          printf '{"version":"%s","build":{"beforeBuildCommand":""}}' \
            "${{ steps.version.outputs.value }}" > "$RUNNER_TEMP/tauri.ci.conf.json"
          cat "$RUNNER_TEMP/tauri.ci.conf.json"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-arm64

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # 有证书才导入；没有证书时整个签名步骤会跳过，产物仍是可用的未签名版本
      - name: Import code signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -C web run build

      # 构建失败时把日志尾部写进 Job Summary —— Actions 的原始日志需要登录才能下载，
      # 而 Summary 在公开仓库里无需登录即可查看，方便维护者和贡献者一起排错。
      - name: Build DMG
        working-directory: src-tauri
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          set +e
          tauri build \
            --target aarch64-apple-darwin \
            --bundles dmg \
            --config "$RUNNER_TEMP/tauri.ci.conf.json" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## ❌ DMG build failed (exit $status)"
              echo '```'
              tail -n 120 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Generate SHA-256 checksums
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Voxril ${{ env.TAG }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          body: |
            ## 下载即用

            1. 下载下面的 `.dmg`
            2. 双击打开，把 **Voxril** 拖进「应用程序」
            3. 首次启动会自动安装 Python 依赖并下载模型（需要本机已有 Python 3.10+）

            ## 系统要求

            - macOS 14.0 (Sonoma) 及以上
            - Apple Silicon（M1 / M2 / M3 / M4），不支持 Intel Mac

            ## 打不开怎么办

            如果提示「无法验证开发者」或「已损坏」，执行一次：

            ```bash
            xattr -dr com.apple.quarantine /Applications/Voxril.app
            ```

            已签名的版本不需要这一步，直接双击即可。

            ---

            ### Download & run

            1. Download the `.dmg` below
            2. Open it and drag **Voxril** into **Applications**
            3. First launch installs the Python environment and downloads the models

            Requires macOS 14+ on Apple Silicon and Python 3.10+ installed.
            Unsigned builds need `xattr -dr com.apple.quarantine /Applications/Voxril.app`.
