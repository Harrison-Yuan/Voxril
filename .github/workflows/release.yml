name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-arm64

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # 覆盖 beforeBuildCommand：CI 里没有 .venv，跳过 bump_version 与依赖校验，
      # 版本号直接取 tag（v0.1.15 → 0.1.15）。
      - name: Build DMG
        working-directory: src-tauri
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          tauri build \
            --target aarch64-apple-darwin \
            --bundles dmg \
            --config "{\"version\":\"${{ steps.ver.outputs.version }}\",\"build\":{\"beforeBuildCommand\":\"\"}}"

      - name: Upload DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          generate_release_notes: true
          body: |
            ## Voxril ${{ github.ref_name }}

            ### 安装方式
            1. 下载 `.dmg` 文件并打开
            2. 将 Voxril 拖入 Applications
            3. 首次运行会提示安装 Python 依赖（需本机已安装 Python 3.10+，建议 Homebrew）
            4. 首次运行会自动下载模型文件（HuBERT / RMVPE / 预训练底模）

            ### 系统要求
            - macOS 14.0+ (Sonoma)
            - Apple Silicon (M1 / M2 / M3 / M4)

            ### 未签名提示
            该安装包由 CI 构建、未做 Apple 公证。若打开时提示“已损坏”或“无法验证开发者”，执行：

            ```bash
            xattr -dr com.apple.quarantine /Applications/Voxril.app
            ```
