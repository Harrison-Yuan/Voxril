name: Release

on:
  push:
    tags:
      - "v*"
  # 需要重打某个 tag 时，在 Actions 页面手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag，例如 v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      # ── 可选：配置这些 secrets 后自动签名 + 公证，用户双击即可打开 ──
      # 注意：这里用 SIGN_* 变量名中转，只有在真正配置了证书时才导出成
      # APPLE_* 交给 Tauri。若直接把 secrets.APPLE_CERTIFICATE 写进 env，
      # 未配置时它会以空字符串存在，Tauri 会误以为要签名而导入空证书并报错。
      SIGN_CERT: ${{ secrets.APPLE_CERTIFICATE }}
      SIGN_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      SIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Fetch bundled Python runtime
        run: bash tools/fetch_python_runtime.sh

      - name: Resolve version from tag
        id: version
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

      # 生成一份 CI 专用配置：版本号取 tag，且跳过本地的 beforeBuildCommand
      # （CI 里没有 .venv，bump_version 与依赖校验只适用于本地打包）
      - name: Prepare CI config
        run: |
          printf '{"version":"%s","build":{"beforeBuildCommand":""}}' \
            "${{ steps.version.outputs.value }}" > "$RUNNER_TEMP/tauri.ci.conf.json"
          cat "$RUNNER_TEMP/tauri.ci.conf.json"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-arm64

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # 有证书才把 APPLE_* 交给 Tauri（它自己会导入钥匙串并签名 + 公证）；
      # 没有证书时显式关闭签名探测，产物是未签名版本。
      - name: Configure signing
        run: |
          if [ -n "$SIGN_CERT" ]; then
            {
              echo "APPLE_CERTIFICATE<<__CERT__"
              echo "$SIGN_CERT"
              echo "__CERT__"
              echo "APPLE_CERTIFICATE_PASSWORD=$SIGN_CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGN_IDENTITY"
              echo "APPLE_ID=$NOTARY_APPLE_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID"
              echo "SIGNING_ENABLED=true"
            } >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "SIGNING_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm -C web run build

      # 只构建 .app：Tauri 自带的 DMG 打包脚本依赖 AppleScript 操作 Finder，
      # 在无图形会话的 CI runner 上容易失败；DMG 改用 hdiutil 生成，完全不依赖 GUI。
      # 失败时把日志尾部写进 Job Summary，并把第一条错误作为注解暴露出来。
      - name: Build app
        working-directory: src-tauri
        run: |
          set +e
          tauri build \
            --target aarch64-apple-darwin \
            --bundles app \
            --config "$RUNNER_TEMP/tauri.ci.conf.json" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## ❌ Build failed (exit $status)"
              echo '```'
              tail -n 120 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -i -m1 -E "error(\[|:)|failed|panic" build.log \
              | while IFS= read -r line; do echo "::error title=build.log::${line}"; done
            exit "$status"
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Voxril.app"
          OUT="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg"
          STAGE="$(mktemp -d)"

          test -d "$APP" || { echo "::error title=missing app::找不到 $APP"; exit 1; }
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p "$OUT"

          hdiutil create \
            -volname "Voxril" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            "$OUT/Voxril_${VERSION}_aarch64.dmg"

          rm -rf "$STAGE"
          ls -lh "$OUT"

      # 仅当配置了 Apple secrets 时才公证；未签名的构建会跳过
      - name: Notarize DMG
        if: env.SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          DMG="$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Generate SHA-256 checksums
        run: |
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          shasum -a 256 ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Voxril ${{ env.TAG }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          body: |
            ## 下载即用

            1. 下载下面的 `.dmg`
            2. 双击打开，把 **Voxril** 拖进「应用程序」
            3. 首次启动会自动安装 Python 依赖并下载模型（需要本机已有 Python 3.10+）

            ## 系统要求

            - macOS 14.0 (Sonoma) 及以上
            - Apple Silicon（M1 / M2 / M3 / M4），不支持 Intel Mac

            ## 打不开怎么办

            如果提示「无法验证开发者」或「已损坏」，执行一次：

            ```bash
            xattr -dr com.apple.quarantine /Applications/Voxril.app
            ```

            已签名的版本不需要这一步，直接双击即可。

            ---

            ### Download & run

            1. Download the `.dmg` below
            2. Open it and drag **Voxril** into **Applications**
            3. First launch installs the Python environment and downloads the models

            Requires macOS 14+ on Apple Silicon and Python 3.10+ installed.
            Unsigned builds need `xattr -dr com.apple.quarantine /Applications/Voxril.app`.
