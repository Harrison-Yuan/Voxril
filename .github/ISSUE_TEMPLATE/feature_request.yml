name: 💡 功能建议
description: 想要新的能力、更顺手的流程，或对现有交互不满意
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        建议先说清「你遇到的麻烦」，再说「你希望的解决方案」——
        我们更愿意实现能解决真实问题的功能，而不是孤立的功能点。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的麻烦
      description: 现在的流程里哪一步最费劲、最容易出错？
      placeholder: 每次转换完都要自己去 mixed 文件夹找文件，不知道成品在哪。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你希望的解决方式
      placeholder: 转换完成后在页面里直接给出「打开所在文件夹」按钮，并记住上次的输出目录。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 其他工具是怎么做的？有没有你试过但不满意的办法？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能
      options:
        - 人声分离
        - 模型训练
        - 语音转换
        - 合成伴奏
        - 模型管理
        - 设置 / 工作区
        - 实时翻唱（实验特性）
        - 文档与教程
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 你是否愿意参与实现
      options:
        - label: 我愿意提交 PR（可以先在 Issue 里一起确认方案）
          required: false
        - label: 我可以帮忙测试和反馈效果
          required: false
